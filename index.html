<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>AI Auditor</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.6/dist/css/bootstrap.min.css" rel="stylesheet" integrity="sha384-4Q6Gf2aSP4eDXB8Miphtr37CMZZQ5oXLH2yaXMJ2w8e2ZtHTl7GptT4jmndRuHDT" crossorigin="anonymous">
    <link rel="stylesheet" href="style.css">
    
</head>
<body>
    <div class="container-fluid bg-dark text-white p-4 mb-4">
        <h1 class="text-center mb-4">AI Auditor</h1>
        <p class="text-center">Check where you can cut extra expenditure on AI</p>
    </div>
    <main>
        <form id="auditForm">
            <section class="section mb-4">
                <h2 class="mb-3">Team Information</h2>
                <div class="row">
                    <div class="field">
                        <label class="form-label">Team size</label>
                        <select class="form-select" id="teamSize" required>
                            <option value="1">Just me (1)</option>
                            <option value="3">Small   (2-5)</option>
                            <option value="10">Medium  (6-15)</option>
                            <option value="20">Large   (16+)</option>
                        </select>
                    </div>
                    <div class="field">
                        <label class="form-label">Primary use case</label>
                        <select class="form-select" id="useCase" required>
                            <option value="coding">Coding</option>
                            <option value="writing">Writing</option>
                            <option value="research">Research</option>
                            <option value="mixed">Mixed</option>
                        </select> 
                    </div>
                </div>
            </section>
            <section class="tool-card section mb-4">
                <h3 class="mb-3">ChatGpt</h3>
                <div class="row">
                    <div class="field">
                        <label class="form-label">Plan</label>
                        <select class="chatgpt_plan form-select">
                            <option value=""> -don't use</option>
                            <option value="plus">Plus ($20 / mo)</option>
                            <option value="team">Team ($25/user/mo)</option>
                            <option value="enterprise">Enterprise</option>
                            <option value="api">API Direct</option>
                        </select>
                    </div>
                    <div class="field">
                        <label class="form-label">Seats</label>
                        <input type="number" class="form-control" id="chatgpt_seats"min="1" value="1">
                    </div>
                    <div class="field">
                        <label class="form-label">Monthly cost</label>
                        <input type="number" class="form-control" id="chatgpt_spend" min="0" placeholder="0">
                    </div>
                </div>
            </section>
            <section class="tool-card section mb-4">
                <h3 class="mb-3">Claude</h3>
                <div class="row">
                    <div class="field">
                        <label class="form-label">Plan</label>
                        <select class="claude_plan form-select">
                            <option value="">— don't use</option>
                            <option value="pro">Pro ($20/mo)</option>
                            <option value="max">Max ($100/mo)</option>
                            <option value="team">Team ($25/user/mo)</option>
                            <option value="enterprise">Enterprise</option>
                            <option value="api">API Direct</option>
                        </select>
                    </div>
                    <div class="field">
                        <label class="form-label">Seats</label>
                        <input type="number" class="form-control" id="claude_seats" min="1" value="1">
                    </div>
                    <div class="field">
                        <label class="form-label">Monthly cost</label>
                        <input type="number" class="form-control" id="claude_spend" min="0" placeholder="0">
                    </div>
                </div>
            </section>
            <section class="tool-card section mb-4">
                <h3 class="mb-3">Github Copilot</h3>
                <div class="row">
                    <div class="field">
                        <label class="form-label">Plan</label>
                        <select class="claude_plan form-select">
                            <option value="">— don't use</option>
                            <option value="pro">Individual ($10/mo)</option>
                            <option value="max">Business ($19/user/mo)</option>
                            <option value="enterprise">Enterprise ($39/user/mo)</option>
                        </select>
                    </div>
                    <div class="field">
                        <label class="form-label">Seats</label>
                        <input type="number" class="form-control" id="copilot_seats" min="1" value="1">
                    </div>
                    <div class="field">
                        <label class="form-label">Monthly cost</label>
                        <input type="number" class="form-control" id="copilot_spend" min="0" placeholder="0">
                    </div>
                </div>
            </section>
            <section class="tool-card section mb-4">
                <h3 class="mb-3">Gemini</h3>
                <div class="row">
                    <div class="field">
                        <label class="form-label">Plan</label>
                        <select class="claude_plan form-select">
                            <option value="">— don't use</option>
                            <option value="pro">Pro ($20/mo)</option>
                            <option value="max">Ultra (custom)</option>
                            <option value="api">API Direct</option>
                        </select>
                    </div>
                    <div class="field">
                        <label class="form-label">Seats</label>
                        <input type="number" class="form-control" id="gemini_seats" min="1" value="1">
                    </div>
                    <div class="field">
                        <label class="form-label">Monthly cost</label>
                        <input type="number" class="form-control" id="gemini_spend" min="0" placeholder="0">
                    </div>
                </div>
            </section>

            <button type="submit" class="btn btn-dark btn-primary">Audit</button>
        </form>
    </main>
    <script src="app.js"></script>
</body>
</html>
